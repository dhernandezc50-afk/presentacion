<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dependencia Emocional en Jóvenes Adultos | Defensa de Tesina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0b0d14; --bg2:#121624; --card:#171c2e; --line:#262d47;
  --txt:#e9ecf5; --mut:#98a0bd; --gold:#e3b45f; --rose:#e0607e; --viol:#8b7cf6; --teal:#4cc9b0;
  --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,124,246,.18),transparent 60%),
             radial-gradient(700px 500px at -10% 110%,rgba(224,96,126,.14),transparent 60%)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--viol),var(--rose),var(--gold));z-index:50;transition:width .4s}
#deck{position:relative;z-index:1;height:100%}
.slide{position:absolute;inset:0;padding:clamp(18px,4vh,48px) clamp(18px,6vw,90px) 90px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .5s,transform .5s,visibility .5s;overflow-y:auto}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.prev{transform:translateX(-40px)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:14px}
.tag::before{content:"";width:28px;height:1px;background:var(--gold)}
h1,h2{font-family:var(--serif);line-height:1.15}
h1{font-size:clamp(1.9rem,4.4vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.6rem,3.2vw,2.6rem);font-weight:700;margin-bottom:22px}
h3{font-size:1.05rem;font-weight:600;color:var(--gold);margin-bottom:8px}
p,li{font-size:clamp(.95rem,1.5vw,1.2rem);line-height:1.7;color:#cfd4e6;font-weight:300}
strong{color:#fff;font-weight:600}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:22px}
.card.accent{border-color:rgba(227,180,95,.45)}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(139,124,246,.16);color:#c3bbff;font-size:.78rem;font-weight:500;margin:0 6px 6px 0}
ul.clean{list-style:none}
ul.clean li{padding-left:22px;position:relative;margin-bottom:10px}
ul.clean li::before{content:"";position:absolute;left:0;top:.78em;width:8px;height:8px;border-radius:50%;background:var(--rose)}
.speaker{position:absolute;top:18px;right:clamp(18px,4vw,50px);font-size:.72rem;color:var(--mut);border:1px solid var(--line);padding:5px 12px;border-radius:99px;background:rgba(18,22,36,.7)}
.speaker b{color:var(--gold);font-weight:600}
/* portada */
.cover{display:grid;grid-template-columns:1.6fr 1fr;gap:40px;align-items:center}
.cover .uni{font-size:.9rem;color:var(--mut);margin-bottom:22px;letter-spacing:.04em}
.cover .uni b{color:var(--txt)}
.authors{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.authors li{list-style:none;font-size:1rem;padding:3px 0;color:#dfe3f2}
.qrbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center}
#qrcode{background:#fff;padding:12px;border-radius:12px;display:inline-block;min-width:160px;min-height:160px}
#qrcode img,#qrcode canvas{display:block;max-width:100%}
.qrbox small{display:block;color:var(--mut);margin-top:10px;font-size:.78rem;line-height:1.5}
.qrbox input{width:100%;margin-top:10px;background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:.78rem}
.qrbox button{margin-top:8px;background:var(--gold);border:0;color:#1a1405;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.78rem}
/* hipótesis */
.hyp{border-left:3px solid var(--viol);padding-left:16px}
.hyp.h0{border-color:var(--rose)}
.vars{display:flex;align-items:stretch;gap:14px;flex-wrap:wrap}
.vars .card{flex:1;min-width:220px}
.arrow{align-self:center;font-size:2rem;color:var(--gold)}
/* pregunta */
.question{font-family:var(--serif);font-size:clamp(1.4rem,3.2vw,2.5rem);line-height:1.35;border-left:4px solid var(--gold);padding-left:24px;color:#fff}
/* gráficas */
.chart-wrap{display:grid;grid-template-columns:minmax(260px,.9fr) 1.1fr;gap:28px;align-items:center}
.ring{position:relative;max-width:330px;margin:auto;width:100%}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring-center .big{font-family:var(--serif);font-size:clamp(2rem,4.4vw,3.4rem);font-weight:800;color:#fff}
.ring-center .sub{font-size:.72rem;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;max-width:110px;text-align:center}
.bars .row{margin-bottom:14px}
.bars .lbl{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:6px;color:#dfe3f2}
.bars .lbl b{color:#fff}
.bars .track{height:10px;background:#1f2540;border-radius:99px;overflow:hidden}
.bars .fill{height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.insight{margin-top:18px;padding:14px 18px;background:rgba(227,180,95,.08);border:1px solid rgba(227,180,95,.3);border-radius:12px;font-size:.95rem;color:#ecdcb8}
.gnum{font-size:.78rem;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.note{font-size:.7rem;color:var(--mut);margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:20px}
.kpi{text-align:center;padding:18px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.kpi .n{font-family:var(--serif);font-size:2.2rem;font-weight:800;color:var(--gold)}
.kpi .t{font-size:.78rem;color:var(--mut);margin-top:4px;line-height:1.4}
/* nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,4vw,50px);
  background:linear-gradient(0deg,rgba(11,13,20,.95),rgba(11,13,20,0))}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:10px 20px;border-radius:99px;font-size:.88rem;cursor:pointer;font-family:var(--sans);transition:.2s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.35;cursor:default}
#counter{font-size:.9rem;color:var(--mut);font-variant-numeric:tabular-nums}
#counter b{color:var(--gold);font-size:1.05rem}
#timer{font-size:.8rem;color:var(--mut);cursor:pointer;margin-left:14px}
#dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#dots i{width:7px;height:7px;border-radius:50%;background:#2b3354;cursor:pointer;transition:.2s}
#dots i.on{background:var(--gold);transform:scale(1.4)}
@media (max-width:760px){
  .cover,.chart-wrap{grid-template-columns:1fr}
  #dots{display:none}
  .speaker{position:static;align-self:flex-start;margin-bottom:12px}
  .slide{justify-content:flex-start;padding-top:20px}
}
</style>
</head>
<body>
<div id="progress"></div>
<main id="deck"></main>

<nav id="nav">
  <button class="btn" id="prev">← Anterior</button>
  <div style="display:flex;align-items:center;flex-direction:column;gap:8px">
    <div id="dots"></div>
    <div><span id="counter"></span><span id="timer" title="Clic para reiniciar">⏱ 00:00</span></div>
  </div>
  <button class="btn" id="next">Siguiente →</button>
</nav>

<script>
/* ===================== DATOS (editables) =====================
   n = 31. Los porcentajes principales son los de la investigación.
   Las categorías marcadas con (*) son el complemento calculado hasta 100%.
   Si tienen el desglose exacto de cada ítem, reemplácenlo aquí. */
const N = 31;
const CHARTS = [
 { n:1, title:"Necesidad constante de atención", main:71.0, mainLbl:"presenta algún grado",
   data:[["Presenta en algún grado",71.0,"#e0607e"],["No la presenta (*)",29.0,"#2b3354"]],
   insight:"Siete de cada diez participantes manifiestan necesitar atención constante de su pareja." },
 { n:2, title:"Preocupación por el término de la relación", main:61.3, mainLbl:"a veces + siempre",
   data:[["A veces",48.4,"#8b7cf6"],["Siempre",12.9,"#e0607e"],["Otras respuestas (*)",38.7,"#2b3354"]],
   insight:"El miedo a que la relación termine es frecuente: 48.4% lo siente a veces y 12.9% siempre." },
 { n:3, title:"Renuncia a actividades personales por la pareja", main:61.2, mainLbl:"renuncia en total",
   data:[["A veces",54.8,"#8b7cf6"],["Casi siempre / siempre (*)",6.4,"#e0607e"],["No renuncia (*)",38.8,"#2b3354"]],
   insight:"Más de seis de cada diez dejan de lado sus propias actividades; 54.8% lo hace a veces." },
 { n:4, title:"Dificultad para tomar decisiones sin la pareja", main:51.6, mainLbl:"tiene dificultad",
   data:[["Tiene dificultad",51.6,"#e0607e"],["No la tiene (*)",48.4,"#2b3354"]],
   insight:"Más de la mitad reconoce que le cuesta decidir sin consultar o contar con su pareja." },
 { n:5, title:"Estado de ánimo según el estado de la relación", main:32.2, mainLbl:"casi siempre / siempre",
   data:[["Casi siempre / siempre",32.2,"#e0607e"],["Otras respuestas (*)",67.8,"#2b3354"]],
   insight:"Para 1 de cada 3 jóvenes, su estado de ánimo depende casi siempre de cómo va la relación." },
 { n:6, title:"Señales de dependencia identificadas", main:74.2, mainLbl:"necesidad de aprobación",
   data:[["Necesidad de aprobación",74.2,"#e0607e"],["Otras señales / ninguna (*)",25.8,"#2b3354"]],
   insight:"La necesidad de aprobación es la señal más reconocida por los participantes." },
 { n:7, title:"Factores que favorecen la dependencia emocional", main:64.5, mainLbl:"baja autoestima",
   data:[["Baja autoestima",64.5,"#8b7cf6"],["Otros factores (*)",35.5,"#2b3354"]],
   insight:"La baja autoestima es el factor que la mayoría identifica como favorecedor de la dependencia." },
 { n:8, title:"Impacto en la autoestima", main:87.1, mainLbl:"disminuye la confianza",
   data:[["Disminuye la confianza en sí mismo/a",87.1,"#e0607e"],["No afecta (*)",12.9,"#2b3354"]],
   insight:"Casi nueve de cada diez afirman que la dependencia emocional reduce su confianza personal." }
];

/* Reparto de exposición (3 integrantes, ~7-8 min c/u) */
const D="Daniela Hernández", A="Astrid Robles", K="Katherine Conquera";

/* ===================== DIAPOSITIVAS ===================== */
const slides = [];

slides.push({ who:D, html:`
 <div class="cover">
  <div>
   <div class="uni"><b>Universidad Mariano Gálvez de Guatemala</b><br>Facultad de Psicología Industrial</div>
   <div class="tag">Defensa de Tesina</div>
   <h1>Dependencia Emocional en las Relaciones de Pareja de Jóvenes Adultos</h1>
   <ul class="authors">
     <li>Daniela Yeneri Hernández Contreras</li>
     <li>Astrid Pamela Robles Gómez</li>
     <li>Katherine Fabiola Conquera Álvarez</li>
   </ul>
   <p class="note" style="font-size:.85rem">Guatemala, octubre de 2026</p>
  </div>
  <div class="qrbox">
   <div class="tag" style="justify-content:center;margin-bottom:12px">Abrir en el móvil</div>
   <div id="qrcode"></div>
   <small>Escanee el código con la cámara para ver esta presentación.</small>
   <input id="qrurl" placeholder="Pegue aquí el enlace público (https://...)">
   <button onclick="makeQR(document.getElementById('qrurl').value)">Generar QR</button>
  </div>
 </div>`});

slides.push({ who:D, html:`
 <div class="tag">01 · Introducción</div>
 <h2>Contexto del estudio</h2>
 <div class="grid g2">
  <div class="card"><h3>La etapa de la adultez joven</h3>
   <p>En la universidad, los jóvenes adultos consolidan su identidad, su autonomía y sus primeros vínculos afectivos estables. Es una etapa clave para aprender a relacionarse de forma saludable.</p></div>
  <div class="card"><h3>El problema de fondo</h3>
   <p>Cuando el vínculo de pareja se convierte en la principal fuente de valor personal, puede aparecer la <strong>dependencia emocional</strong>: una necesidad afectiva excesiva que limita la libertad y el bienestar.</p></div>
 </div>
 <div class="kpis">
  <div class="kpi"><div class="n">31</div><div class="t">jóvenes universitarios</div></div>
  <div class="kpi"><div class="n">18–31</div><div class="t">años de edad</div></div>
  <div class="kpi"><div class="n">Villa Canales</div><div class="t">Guatemala</div></div>
  <div class="kpi"><div class="n">8</div><div class="t">indicadores analizados</div></div>
 </div>`});

slides.push({ who:D, html:`
 <div class="tag">02 · Marco teórico</div>
 <h2>Síntesis: ¿qué es la dependencia emocional?</h2>
 <div class="grid g3">
  <div class="card accent"><h3>Castelló</h3>
   <p>La describe como una necesidad afectiva extrema que la persona siente hacia su pareja, y que tiende a repetirse a lo largo de distintas relaciones.</p></div>
  <div class="card"><h3>Bowlby</h3>
   <p>Desde la teoría del apego, los vínculos tempranos moldean la forma de relacionarse en la adultez; un apego inseguro puede derivar en búsqueda excesiva de cercanía y miedo al abandono.</p></div>
  <div class="card"><h3>Moral &amp; Sirvent</h3>
   <p>La entienden como un patrón de demandas afectivas desadaptativas dirigidas a la pareja, asociado a miedo a la soledad y a baja autoestima.</p></div>
 </div>
 <div style="margin-top:20px"><span class="pill">Miedo al abandono</span><span class="pill">Necesidad de aprobación</span><span class="pill">Subordinación</span><span class="pill">Baja autoestima</span></div>`});

slides.push({ who:D, html:`
 <div class="tag">03 · Justificación</div>
 <h2>¿Por qué es importante estudiarlo?</h2>
 <div class="grid g2">
  <div class="card"><h3>Relaciones sanas</h3><p>Identificar la dependencia emocional permite promover vínculos basados en el respeto, la reciprocidad y el afecto libre, no en la necesidad.</p></div>
  <div class="card"><h3>Límites personales</h3><p>Reconocer y sostener límites protege la identidad, la autonomía y las metas individuales dentro de la pareja.</p></div>
  <div class="card"><h3>Salud mental</h3><p>La dependencia se vincula con ansiedad, baja autoestima y pérdida de autonomía; detectarla a tiempo previene consecuencias mayores.</p></div>
  <div class="card"><h3>Aporte local</h3><p>Existe poca evidencia sobre jóvenes universitarios de Villa Canales; este estudio aporta datos de su propio contexto.</p></div>
 </div>`});

slides.push({ who:D, html:`
 <div class="tag">04 · Formulación del problema</div>
 <h2>Pregunta central de investigación</h2>
 <p class="question">¿Cómo influye la dependencia emocional en las relaciones de pareja de jóvenes adultos?</p>`});

slides.push({ who:A, html:`
 <div class="tag">05 · Hipótesis y variables</div>
 <h2>Hipótesis de investigación</h2>
 <div class="grid g2">
  <div class="card hyp"><h3>Hipótesis de investigación (H1)</h3>
   <p>La dependencia emocional influye de manera significativa en las relaciones de pareja de los jóvenes adultos.</p></div>
  <div class="card hyp h0"><h3>Hipótesis nula (H0)</h3>
   <p>La dependencia emocional no influye de manera significativa en las relaciones de pareja de los jóvenes adultos.</p></div>
 </div>
 <h3 style="margin-top:26px">Variables</h3>
 <div class="vars">
  <div class="card accent"><div class="gnum">Variable independiente</div><p><strong>Dependencia emocional</strong></p></div>
  <div class="arrow">→</div>
  <div class="card"><div class="gnum">Variable dependiente</div><p><strong>Relaciones de pareja en jóvenes adultos</strong></p></div>
 </div>`});

slides.push({ who:A, html:`
 <div class="tag">06 · Objetivos</div>
 <h2>Objetivo general y específicos</h2>
 <div class="card accent" style="margin-bottom:18px"><h3>Objetivo general</h3>
  <p>Analizar cómo influye la dependencia emocional en las relaciones de pareja de jóvenes adultos universitarios de Villa Canales, Guatemala.</p></div>
 <h3>Objetivos específicos</h3>
 <ul class="clean">
  <li>Identificar las manifestaciones de dependencia emocional en la relación de pareja.</li>
  <li>Reconocer las señales de dependencia que perciben los jóvenes adultos.</li>
  <li>Determinar los factores que favorecen la dependencia emocional.</li>
  <li>Describir el impacto de la dependencia emocional en la autoestima.</li>
 </ul>`});

slides.push({ who:A, html:`
 <div class="tag">07 · Presentación y análisis de resultados</div>
 <h2>Resultados: 8 indicadores, 31 participantes</h2>
 <p>Se aplicó un instrumento a <strong>31 jóvenes adultos universitarios (18–31 años)</strong>. A continuación se presentan los resultados organizados en tres bloques:</p>
 <div class="grid g3" style="margin-top:20px">
  <div class="card"><h3>Manifestaciones</h3><p>Gráficas 1 a 5: atención, miedo a terminar, renuncias, decisiones y estado de ánimo.</p></div>
  <div class="card"><h3>Señales y factores</h3><p>Gráficas 6 y 7: aprobación y baja autoestima.</p></div>
  <div class="card"><h3>Impacto</h3><p>Gráfica 8: efecto sobre la confianza personal.</p></div>
 </div>`});

CHARTS.forEach((c,i)=>{
  slides.push({ who: i<2?A:K, chart:i, html:`
   <div class="tag">Resultados · Gráfica ${c.n} de 8</div>
   <h2>${c.title}</h2>
   <div class="chart-wrap">
    <div class="ring"><canvas id="cv${i}"></canvas>
      <div class="ring-center"><div class="big">${c.main.toFixed(1).replace('.0','')}%</div><div class="sub">${c.mainLbl}</div></div></div>
    <div>
     <div class="bars" id="bars${i}"></div>
     <div class="insight">${c.insight}</div>
     <div class="note">n = ${N} · Fuente: elaboración propia con datos de la investigación. (*) Complemento hasta 100%.</div>
    </div>
   </div>`});
});

slides.push({ who:K, html:`
 <div class="tag">08 · Conclusiones</div>
 <h2>Síntesis de los hallazgos</h2>
 <div class="kpis" style="margin:0 0 20px">
  <div class="kpi"><div class="n">87.1%</div><div class="t">reduce su confianza personal</div></div>
  <div class="kpi"><div class="n">74.2%</div><div class="t">necesidad de aprobación</div></div>
  <div class="kpi"><div class="n">71%</div><div class="t">necesita atención constante</div></div>
  <div class="kpi"><div class="n">64.5%</div><div class="t">identifica baja autoestima</div></div>
 </div>
 <ul class="clean">
  <li>La dependencia emocional está presente en la mayoría de los jóvenes adultos evaluados y se manifiesta en la necesidad de atención, el miedo a la ruptura y la renuncia a actividades propias.</li>
  <li>La necesidad de aprobación y la baja autoestima aparecen como señal y factor principales.</li>
  <li>El impacto más marcado se da en la autoestima, lo que respalda la hipótesis de investigación (H1).</li>
 </ul>`});

slides.push({ who:K, html:`
 <div class="tag">09 · Recomendaciones</div>
 <h2>Propuestas</h2>
 <div class="grid g3">
  <div class="card accent"><h3>Prevención</h3><p>Talleres y campañas universitarias sobre vínculos saludables, autoconocimiento y detección temprana de señales de dependencia.</p></div>
  <div class="card"><h3>Orientación psicológica</h3><p>Espacios de consejería y acompañamiento para fortalecer la autoestima, la autonomía y la regulación emocional.</p></div>
  <div class="card"><h3>Educación relacional</h3><p>Incorporar contenidos sobre límites personales, comunicación asertiva y relaciones de pareja en la formación universitaria.</p></div>
 </div>
 <div class="card" style="margin-top:20px;text-align:center">
  <p style="font-family:var(--serif);font-size:1.5rem;color:#fff">Gracias por su atención</p>
  <p style="font-size:.9rem">Daniela Hernández · Astrid Robles · Katherine Conquera</p>
 </div>`});

/* ===================== MOTOR ===================== */
const deck=document.getElementById('deck'), dots=document.getElementById('dots');
let cur=0, charts={};

slides.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  el.innerHTML=`<div class="speaker">Expone: <b>${s.who}</b></div>`+s.html;
  deck.appendChild(el); s.el=el;
  const d=document.createElement('i'); d.onclick=()=>go(i); dots.appendChild(d);
});

function makeQR(url){
  const box=document.getElementById('qrcode'); if(!box) return;
  box.innerHTML='';
  new QRCode(box,{text:url||location.href,width:160,height:160,correctLevel:QRCode.CorrectLevel.M});
}

function drawChart(i){
  const c=CHARTS[i];
  if(charts[i]){charts[i].destroy();}
  charts[i]=new Chart(document.getElementById('cv'+i),{
    type:'doughnut',
    data:{labels:c.data.map(d=>d[0]),datasets:[{data:c.data.map(d=>d[1]),backgroundColor:c.data.map(d=>d[2]),borderColor:'#0b0d14',borderWidth:3,hoverOffset:6}]},
    options:{cutout:'72%',animation:{duration:1200},plugins:{legend:{display:false},tooltip:{callbacks:{label:t=>` ${t.parsed}%`}}}}
  });
  const bars=document.getElementById('bars'+i);
  bars.innerHTML=c.data.map(d=>`<div class="row"><div class="lbl"><span>${d[0]}</span><b>${d[1]}%</b></div><div class="track"><div class="fill" style="background:${d[2]==='#2b3354'?'#4a5382':d[2]}"></div></div></div>`).join('');
  setTimeout(()=>bars.querySelectorAll('.fill').forEach((f,k)=>f.style.width=c.data[k][1]+'%'),80);
}

function go(n){
  n=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>{s.el.classList.toggle('active',i===n);s.el.classList.toggle('prev',i<n);});
  cur=n;
  if(slides[n].chart!==undefined) drawChart(slides[n].chart);
  document.getElementById('counter').innerHTML=`<b>${n+1}</b> / ${slides.length}`;
  document.getElementById('progress').style.width=((n+1)/slides.length*100)+'%';
  document.getElementById('prev').disabled=n===0;
  document.getElementById('next').disabled=n===slides.length-1;
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===n));
  history.replaceState(null,'','#'+(n+1));
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1);}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
  if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
let tx=null;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)go(cur+(dx<0?1:-1));tx=null;});

/* Cronómetro */
let t0=Date.now(); const tm=document.getElementById('timer');
tm.onclick=()=>t0=Date.now();
setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);tm.textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},1000);

/* Inicio */
const start=parseInt(location.hash.slice(1))||1;
makeQR(location.protocol.startsWith('http')?location.href.split('#')[0]:'');
if(!location.protocol.startsWith('http')){document.getElementById('qrcode').innerHTML='<div style="color:#333;font-size:.75rem;padding:50px 8px">Publique el archivo y pegue el enlace abajo</div>';}
go(start-1);
</script>
