<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dependencia Emocional en Jóvenes Adultos | Defensa de Tesina</title>
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,800;1,9..144,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- Fondo vivo -->
<div class="bg">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  <canvas id="particles"></canvas>
  <div class="grain"></div>
</div>
<div class="spot" id="spot"></div>
<div id="progress"><i></i></div>

<!-- Barra superior -->
<header class="topbar">
  <div class="brand">
    <img src="logo.png" alt="Sello Universidad Mariano Gálvez de Guatemala">
    <div class="brand-txt"><b>Universidad Mariano Gálvez</b><span>Facultad de Psicología Industrial</span></div>
  </div>
  <div class="top-right">
    <div class="speaker" id="speaker"></div>
    <button class="icon-btn" id="btnMenu" title="Índice (tecla M)" aria-label="Índice">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="icon-btn" id="btnFull" title="Pantalla completa (tecla F)" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<!-- Diapositivas -->
<main id="deck"></main>

<!-- Índice -->
<aside id="overview" class="overview">
  <div class="ov-head"><h3>Índice de la presentación</h3><button class="icon-btn" id="btnClose" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ov-grid" id="ovGrid"></div>
</aside>

<!-- Navegación -->
<nav id="nav">
  <button class="btn" id="prev"><span>←</span> Anterior</button>
  <div class="nav-mid">
    <div id="dots"></div>
    <div class="meta"><span id="counter"></span><span class="sep">·</span><span id="timer" title="Clic para reiniciar">00:00</span></div>
  </div>
  <button class="btn primary" id="next">Siguiente <span>→</span></button>
</nav>

<script src="datos.js"></script>
<script src="script.js"></script>
</body>
</html>
